name: demo
on: { workflow_dispatch: {}, push: { tags: ['v*.*.*'] } }
permissions: { contents: write }
jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # vhs-action's self-install of ffmpeg is flaky on GH runners — pre-install it.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg ttyd
      - uses: charmbracelet/vhs-action@v2
        with: { path: docs/demo.tape, install-fonts: true }   # writes assets/demo.gif per the tape's Output line
      - run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          # vhs occasionally produces no gif without failing — degrade to a
          # no-op instead of a red run.
          if [ ! -f assets/demo.gif ]; then
            echo "no demo.gif produced by vhs — nothing to commit"
            exit 0
          fi
          git add assets/demo.gif
          git commit -m "chore: render demo gif" || { echo "no change"; exit 0; }
          # Site-refresh commits land on main between tags, so a direct
          # HEAD:main push is rejected non-fast-forward (every tag run since
          # v0.4.0 failed this way). Rebase the single-file gif commit onto
          # latest main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
